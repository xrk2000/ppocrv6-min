[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppocrv6-min"
version = "0.1.0"
description = "Minimal-dependency PP-OCRv6 (tiny det + tiny rec) inference with ONNX Runtime — no PaddlePaddle / PaddleOCR required."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "zmxy" }]
keywords = ["ocr", "paddleocr", "pp-ocrv6", "onnxruntime", "text-detection", "text-recognition"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.16",
    "opencv-python>=4.8",
    "pyclipper>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]
gpu = ["onnxruntime-gpu>=1.16"]

[project.scripts]
ppocrv6-min = "ppocrv6_min.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ppocrv6_min = ["models/**/*.onnx", "models/**/*.yml", "models/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
